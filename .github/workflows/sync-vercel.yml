name: Verify game and sync accessible production assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-vercel.yml'
permissions:
  contents: write
jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed playable source and attempt Vercel mirror
        env:
          BASE_URL: https://moonshift-beyond-earth-v32.vercel.app
        run: |
          python3 - <<'PY'
          import os, concurrent.futures, urllib.request, pathlib, tempfile, shutil
          paths = [
            "brand/banner.webp",
            "brand/icon-16.png",
            "brand/icon-180.png",
            "brand/icon-192.png",
            "brand/icon-32.png",
            "brand/icon-512.png",
            "brand/logo.webp",
            "brand/wordmark.webp",
            "chunks/part-000.txt",
            "chunks/part-001.txt",
            "chunks/part-002.txt",
            "chunks/part-003.txt",
            "chunks/part-004.txt",
            "chunks/part-005.txt",
            "chunks/part-006.txt",
            "chunks/part-007.txt",
            "chunks/part-008.txt",
            "chunks/part-009.txt",
            "chunks/part-010.txt",
            "chunks/part-011.txt",
            "chunks/part-012.txt",
            "chunks/part-013.txt",
            "chunks/part-014.txt",
            "chunks/part-015.txt",
            "chunks/part-016.txt",
            "chunks/part-017.txt",
            "chunks/part-018.txt",
            "chunks/part-019.txt",
            "chunks/part-020.txt",
            "chunks/part-021.txt",
            "chunks/part-022.txt",
            "chunks/part-023.txt",
            "crew-v5.js",
            "crew-v7.js",
            "crew/atlas-v7.webp",
            "crew/atlas.avif",
            "demo.html",
            "demo/index.html",
            "favicon.ico",
            "frame-clock-v7.js",
            "health-v6.js",
            "index.html",
            "manifest.webmanifest",
            "mission-bootstrap-v5.js",
            "mission-core-v6.js",
            "mission-science-v5.js",
            "mission-upgrades-v5.js",
            "mission-visuals-v7.js",
            "portraits/abdelrahman.webp",
            "portraits/eyad.webp",
            "portraits/fatema.webp",
            "portraits/rawan.webp",
            "portraits/rewaa.webp",
            "presentation-v6.css",
            "presentation-v6.js",
            "progress-model-v7.js",
            "session-runtime-v7.js",
            "session-storage-v7.js",
            "session-v7.css",
            "tasks-v2.js",
            "tasks-v3-adapter.js",
            "tasks-v4.js",
            "vercel.json",
            "voice-v8-map.json",
            "voices/eyad_001.ogg",
            "voices/eyad_002.ogg",
            "voices/eyad_003.ogg",
            "voices/eyad_004.ogg",
            "voices/eyad_005.ogg",
            "voices/eyad_006.ogg",
            "voices/eyad_007.ogg",
            "voices/eyad_008.ogg",
            "voices/eyad_009.ogg",
            "voices/eyad_010.ogg",
            "voices/eyad_011.ogg",
            "voices/eyad_012.ogg",
            "voices/rawan-001.ogg",
            "voices/rawan-002.ogg",
            "voices/rawan-003.ogg",
            "voices/rawan-004.ogg",
            "voices/rawan-005.ogg",
            "voices/rawan-006.ogg",
            "voices/rawan-007.ogg",
            "voices/rawan-008.ogg",
            "voices/rawan-009.ogg",
            "voices/rawan-010.ogg",
            "voices/rawan-011.ogg",
            "voices/rawan-012.ogg",
            "voices/rawan-013.ogg",
            "water-v6.js",
          ]
          source = pathlib.Path("game")
          missing = [p for p in paths if not (source / p).is_file()]
          present = [p for p in paths if (source / p).is_file()]
          print("Verified", len(present), "committed source assets in game/")
          if missing:
              print("Source-only missing paths (may be available from production):", ", ".join(missing))
          # Only call this a Vercel mirror if the entire public asset set can be retrieved.
          # Vercel deployment source (including private functions) is NOT necessarily public.
          def retrieve(p):
              req=urllib.request.Request(os.environ["BASE_URL"] + "/" + p,
                  headers={"User-Agent":"MOONSHIFT-Asset-Verification/1.0"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  data=response.read()
                  content_type=response.headers.get("content-type","")
              if not data or b"Authentication Required" in data[:5000] or b"Vercel Authentication" in data[:5000]:
                  raise ValueError("Access denied or empty asset")
              if p.endswith((".png",".webp",".avif",".ico",".ogg")) and "text/html" in content_type:
                  raise ValueError("HTML returned instead of binary asset")
              if p.endswith((".html", ".js", ".css", ".txt", ".json", ".webmanifest")) and "text/html" in content_type and not p.endswith(".html"):
                  raise ValueError("HTML returned instead of requested asset")
              return p,data
          results={}
          errors=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              futures={pool.submit(retrieve,p):p for p in paths}
              for future in concurrent.futures.as_completed(futures):
                  try:
                      p,data=future.result()
                      results[p]=data
                  except Exception as e:
                      errors.append((futures[future],str(e)))
          if errors:
              print("Production mirror unavailable for",len(errors),"files; existing complete game/ source is preserved.")
              for p,e in errors[:12]:
                  print("Unavailable:",p,e)
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as s:
                  s.write("### MOONSHIFT source verification passed\n")
                  s.write(f"{len(paths)} existing source assets verified in game/.\n\n")
                  s.write(f"Vercel public mirror **not verified**: {len(errors)} files inaccessible. Existing files left untouched.\n")
          else:
              for p,data in results.items():
                  (source/p).write_bytes(data)
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as s:
                  s.write("### MOONSHIFT production assets mirrored\n")
                  s.write(f"{len(results)} accessible assets copied into game/. Live API backend is not included.\n")
              print("Mirrored",len(results),"public production assets")
          PY
      - name: Commit only verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/
          if ! git diff --cached --quiet; then
            git commit -m "Sync verified MOONSHIFT public production assets"
            git push
          else
            echo "No game source changes required."
          fi
